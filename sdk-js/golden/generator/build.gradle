plugins {
    id 'application'
    id 'com.diffplug.spotless'
}

java {
    sourceCompatibility=JavaVersion.VERSION_25
    targetCompatibility=JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    mavenLocal()
}

spotless {
    java {
        target('**/*.java')
        palantirJavaFormat()
    }
}

dependencies {
    implementation project(':sdk-java')
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
}

application {
    mainClass = 'io.littlehorse.sdkjs.golden.GoldenGenerator'
}

// Emits the serde fixture (how Java encodes values as VariableValue).
tasks.register('runSerde', JavaExec) {
    group = 'application'
    description = 'Generates sdk-js/golden/serde.json'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.littlehorse.sdkjs.golden.SerdeGoldenGenerator'
}

// Emits sdk-java's public wfsdk API surface (the freshness-check denominator).
tasks.register('runSurface', JavaExec) {
    group = 'application'
    description = 'Generates sdk-js/golden/java-surface.json'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.littlehorse.sdkjs.golden.SurfaceGenerator'
}
