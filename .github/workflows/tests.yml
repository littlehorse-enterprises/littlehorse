name: tests
run-name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
jobs:
  tests-sdk-java:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: ${{ matrix.java-version }}

      - name: Tests
        run: ./gradlew sdk-java:spotlessCheck sdk-java:test sdk-java:build

      - name: Java Documentation
        run: ./gradlew sdk-java:javadoc

  tests-sdk-go:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Validate Formatting
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1 ; fi

      - name: Tests
        run: go test ./sdk-go/...

  tests-sdk-js:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install Dependencies
        working-directory: ./sdk-js
        run: pnpm install

      - name: Validate Formatting
        working-directory: ./sdk-js
        run: pnpm run lint

      - name: Build
        working-directory: ./sdk-js
        run: pnpm run build && pnpm run build:conformance

      - name: Tests
        working-directory: ./sdk-js
        run: pnpm test

  conformance:
    # Report-only for now: the suite publishes evidence and must not gate
    # anyone's merge until teams opt in.
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # full history: the runner stamps results with the last commit
          # that touched sdk-conformance/areas, which a shallow clone hides
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Build Testees
        run: |
          ./gradlew :sdk-java-conformance:installDist
          pnpm --dir sdk-js install
          pnpm --dir sdk-js run build
          pnpm --dir sdk-js run build:conformance

      - name: Corpus Freshness
        run: node sdk-conformance/runner/freshness.mjs

      - name: Grade
        run: node sdk-conformance/runner/run.mjs

      - name: Matrix Staleness
        run: node sdk-conformance/runner/matrix.mjs --check

      - name: Random Dual-Compile
        run: node sdk-conformance/runner/fuzz.mjs 50 16

  tests-sdk-python:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest", "windows-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        working-directory: ./sdk-python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install poetry
          poetry install

      - name: Validate Indentations
        working-directory: ./sdk-python
        run: poetry run ruff check .

      - name: Validate Types
        working-directory: ./sdk-python
        run: poetry run mypy .

      - name: Tests
        working-directory: ./sdk-python
        run: poetry run python -m unittest -v

  tests-canary:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Tests
        run: ./gradlew canary:spotlessCheck canary:test canary:build

  tests-server-unit:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Validate Indentations
        run: ./gradlew server:spotlessCheck

      - name: Unit Tests
        run: ./gradlew server:test

  tests-server-e2e:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: E2E Tests
        run: ./gradlew server:e2e

  tests-server-e2e-slow:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Slow E2E Tests
        run: ./gradlew server:e2eSlow

  tests-test-utils:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: ${{ matrix.java-version }}

      - name: Tests
        run: ./gradlew test-utils:spotlessCheck test-utils:test test-utils:build

      - name: Java Documentation
        run: ./gradlew test-utils:javadoc

  tests-test-utils-container:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: ${{ matrix.java-version }}

      - name: Tests
        run: ./gradlew test-utils-container:spotlessCheck test-utils-container:test test-utils-container:build

      - name: Java Documentation
        run: ./gradlew test-utils-container:javadoc

  tests-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Build Dashboard
        working-directory: ./dashboard
        run: |
          pnpm install
          pnpm run build
          pnpm run test

  tests-sdk-dotnet:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "6"
      - name: Build Project
        run: dotnet build sdk-dotnet/LittleHorse.Sdk/LittleHorse.Sdk.csproj
      - name: Test Dotnet
        run: dotnet test sdk-dotnet/LittleHorse.Sdk.Tests
