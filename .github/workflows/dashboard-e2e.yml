name: Dashboard E2E

# End-to-end tests that run the real Dashboard (browser) against a real LittleHorse
# server seeded with deterministic fixtures. See dashboard/QA.md.

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'sdk-js/**'
      - 'examples/java/dashboard-e2e-fixtures/**'
      - '.github/workflows/dashboard-e2e.yml'
  workflow_dispatch:

jobs:
  e2e-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      littlehorse:
        image: ghcr.io/littlehorse-enterprises/littlehorse/lh-standalone:master
        ports:
          - 2023:2023

    env:
      LHC_API_HOST: localhost
      LHC_API_PORT: 2023
      E2E_BASE_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Wait for LittleHorse server
        run: |
          for i in $(seq 1 60); do nc -z localhost 2023 && exit 0; sleep 2; done
          echo "LittleHorse server did not become ready" >&2; exit 1

      - name: Seed fixtures
        run: |
          nohup ./gradlew :example-dashboard-e2e-fixtures:run --console=plain > /tmp/fixtures.log 2>&1 &
          for i in $(seq 1 150); do grep -q FIXTURES_READY /tmp/fixtures.log && exit 0; sleep 2; done
          echo "Fixtures did not become ready:" >&2; cat /tmp/fixtures.log >&2; exit 1

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: pnpm install

      - name: Install Playwright browsers
        working-directory: ./dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./dashboard
        # Playwright's webServer starts the dashboard (dev) pointed at the seeded server.
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7
