name: Rust SDK
on:
  push:
    branches: [master, feat/rust-sdk]
    paths: ['sdk-rust/**', 'schemas/littlehorse/**', 'sdk-conformance/**', 'examples/rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['sdk-rust/**', 'schemas/littlehorse/**', 'sdk-conformance/**', 'examples/rust/**', '.github/workflows/rust.yml']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: sdk-rust
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.89.0
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-rust -> target
      - run: cargo fmt --all -- --check
        if: matrix.rust == 'stable'
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: matrix.rust == 'stable'
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo fmt --manifest-path ../examples/rust/quickstart/Cargo.toml -- --check
        if: matrix.rust == 'stable'
      - run: cargo clippy --manifest-path ../examples/rust/quickstart/Cargo.toml --all-targets --locked -- -D warnings
        if: matrix.rust == 'stable'
      - run: cargo check --manifest-path ../examples/rust/quickstart/Cargo.toml --all-targets --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-rust -> target
      - run: python3 scripts/check-packages.py
  stable-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-rust -> target
      - name: Start compatibility server v1.3.1
        run: docker run -d --name littlehorse -p 2023:2023 ghcr.io/littlehorse-enterprises/littlehorse/lh-standalone:1.3.1
      - run: cargo test --test live_server --test live_features --locked -- --ignored --nocapture
      - name: Test KYC quickstart approval and rejection
        run: cargo test --manifest-path ../examples/rust/quickstart/Cargo.toml --locked -- --ignored --nocapture
      - if: failure()
        run: docker logs --tail 300 littlehorse
      - if: always()
        run: docker rm -f littlehorse
  current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk-rust -> target
      - uses: gradle/actions/setup-gradle@v4
      - name: Build current server and Java reference testee
        working-directory: .
        run: ./gradlew :server:installDist :sdk-java-conformance:installDist -x test -x spotlessJavaCheck --no-daemon
      - name: Compile Rust against shared schemas
        run: cargo build --features conformance --bin lh-conformance --locked
      - name: Build JavaScript reference testee
        working-directory: .
        run: |
          pnpm --dir sdk-js install --frozen-lockfile
          pnpm --dir sdk-js run build
          pnpm --dir sdk-js run build:conformance
      - name: Grade all SDKs and compare 50 seeded workflows
        working-directory: .
        run: |
          node sdk-conformance/runner/run.mjs
          node sdk-conformance/runner/matrix.mjs --check
          node sdk-conformance/runner/fuzz.mjs 50 24
      - name: Test using shared conformance fixtures
        run: cargo test --workspace --all-features --all-targets --locked
      - name: Build standalone server from current source
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.master" <<'DOCKERFILE'
          FROM ghcr.io/littlehorse-enterprises/littlehorse/lh-standalone@sha256:ddc8a42f1f4ec397643f755fa245fd0dfe66943afb51a36b16dc11b24586e8d0
          ARG UPSTREAM_COMMIT
          LABEL org.opencontainers.image.revision=$UPSTREAM_COMMIT
          RUN rm -rf /lh/lib /lh/bin/server
          COPY server/build/install/server/lib /lh/lib
          COPY server/build/install/server/server /lh/bin/
          COPY docker/standalone/kafka-entrypoint.sh docker/standalone/littlehorse-entrypoint.sh docker/standalone/docker-entrypoint.sh /lh/
          RUN test -f /lh/bin/server && chmod +x /lh/bin/server /lh/*entrypoint.sh
          DOCKERFILE
          docker build --build-arg UPSTREAM_COMMIT="${{ github.sha }}" -f "$RUNNER_TEMP/Dockerfile.master" -t littlehorse-rust-master ..
          docker run -d --name littlehorse -p 2023:2023 littlehorse-rust-master
      - name: Execute master and compatibility behavior tests
        run: cargo test --test live_server --test live_features --test live_master --locked -- --ignored --nocapture
      - name: Test KYC quickstart approval and rejection
        run: cargo test --manifest-path ../examples/rust/quickstart/Cargo.toml --locked -- --ignored --nocapture
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-conformance
          path: sdk-conformance/results/*.json
          if-no-files-found: ignore
      - if: failure()
        run: docker logs --tail 300 littlehorse || true
      - if: always()
        run: docker rm -f littlehorse || true
