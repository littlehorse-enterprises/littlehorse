[package]
name = "littlehorse-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/littlehorse-enterprises/littlehorse"
documentation = "https://docs.rs/littlehorse-derive"
description = "Derive macros for the LittleHorse Rust SDK"
[lib]
proc-macro = true
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
