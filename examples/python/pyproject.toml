[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "littlehorse-examples"
version = "0.1.0"
description = "Standalone LittleHorse Python examples."
readme = "README.md"
license = { text = "AGPLv3" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "littlehorse-client @ ../../sdk-python",
    "grpcio==1.85.0",
    "protobuf==7.36.2",
    "googleapis-common-protos==1.76.0",
    "jproperties==2.1.2",
    "authlib==1.9.1",
    "requests==2.34.2",
    "typing_extensions"
]

[tool.poetry]
name = "littlehorse-examples"
version = "0.1.0"
description = "Standalone LittleHorse Python examples."
packages = []
package-mode = false
